<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>صفحه ثبت نام و ورود </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"  rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"  rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }
  
    .form-container {
      max-width: 600px;
      margin: auto;
      padding: 2rem;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
  
    /* Tab nav */
    .nav-tabs {
      background-color: #ffffff;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }
  
    .nav-link {
      color: #495057 !important;
      font-weight: 500;
      border-radius: 5px;
      margin-right: 5px;
      background-color: #e9ecef;
      transition: all 0.3s ease;
    }
  
    .nav-link:hover {
      background-color: #dee2e6;
    }
  
    .nav-link.active {
      background-color: #0d6efd !important;
      color: white !important;
      border-color: transparent;
    }
  
    .tab-content {
      background-color: white;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
  
    .btn-primary, .btn-success {
      font-weight: bold;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">🏫 سامانه ثبت نام  </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <!-- Home Dropdown -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-house-door-fill"></i> خانه
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="{% url 'accounts:login' %}">📊 صفحه اصلی  </a></li>

          </ul>
        </li>

        <!-- School Profile -->
        <li class="nav-item">
          <a class="nav-link" href="{% url 'guidance:total_news' %}"><i class="bi bi-building"></i> اطلاعیه ها </a>
        </li> 

        <!-- Manage Students -->
        {% comment %} <li class="nav-item">
          <a class="nav-link" href="#"><i class="bi bi-person-lines-fill"></i> Manage Students</a>
        </li> {% endcomment %}

      </ul>

      <!-- Right Side Menu -->
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="#"><i class="bi bi-person-circle"></i> {{ request.user.email }}</a>
        </li>
        <li class="nav-item">
          {% if user.is_authenticated %}
            <a class="nav-link" href="{% url 'accounts:logout' %}"><i class="bi bi-box-arrow-right"></i> خروج</a>
          {% else %}
            <a class="nav-link" href="{% url 'accounts:login' %}"><i class="bi bi-box-arrow-right"></i> ورود</a>
          {% endif %}
        </li>
      </ul>
    </div>
  </div>
</nav>

{% block main_content %}

{% endblock main_content %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> 
</body>
</html>
